[project]
name = "trading-strategies"
version = "0.1.0"
description = "Graph and factor-based trading strategies built on the backtester engine."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kaito", email = "kaito.fuss@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "backtester",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "scipy>=1.18.0",
    "yfinance>=1.5.1",
]

[project.urls]
Homepage = "https://github.com/KaitoFuss/trading-strategies"
Repository = "https://github.com/KaitoFuss/trading-strategies"
Issues = "https://github.com/KaitoFuss/trading-strategies/issues"

[tool.uv.sources]
backtester = { git = "https://github.com/KaitoFuss/backtester", rev = "fb592fc87b4bb02a41d26356cc766136996aa883" }

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.6.0",
    "pandas-stubs>=3.0.3.260530",
    "scipy-stubs>=1.18.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["trading_strategies"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=trading_strategies --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
